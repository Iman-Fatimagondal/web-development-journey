<!DOCTYPE html>
<html lang="en">
    <head>
        <title>admission form</title>
    </head>
    <body>
        <h1>Admission Form</h1>
        <form action="#" method="post">
            <label for="name">Student Name:</label><br>
            <input type="text" id="name" name="name"><br><br>
            <label for="father" >Father Name:</label><br>
            <input type="text" id="father" name="father"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>
            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob"><br><br>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
            <label >Hobbies:</label><br>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="traveling" name="hobbies" value="traveling">
            <label for="traveling">Traveling</label>
            <input type="checkbox" id="baking" name="hobbies" value="baking">
            <label for="baking">Baking</label><br><br>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="50"></textarea><br><br>
            <label for="province">province:</label><br>
            <select id="province" name="province">
                <option value="punjab">punjab</option>
                <option value="kpk">kpk</option>
                <option value="blochistan">blochistan</option>
                <option value="sindh">sindh</option>
            </select><br><br>
            <label for="program">program</label>
            <select id="program" name="program">
                <option value="computer science">computer science</option>
                <option value="software engineering">software engineering</option>
                <option value="information technology">information technology</option>
                <option value="artificial intelligence">artificial intelligence</option>
            </select><br><br>
            <label for="photo">upload photo</label>
            <input type="file" id="photo" name="photo"><br><br>
            <input type="submit" value="Submit">
        </form>
    </body>
</html>

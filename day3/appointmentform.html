<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Form</title>
</head>
<body>
    <h1>Appointment Form</h1>
    <form action="/submit-appointment" method="POST">
    <fieldset>
    <legend>patient information</legend>
    <label for="name">NAME</label>
    <input type="text" id="name" name="name" required><br><br>
    <label for="age">Age</label>
    <input type="number" id="age" name="age" required><br><br>
    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
     <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="transgender"name="gender" value="transgender">
    <label for="transgender">Transgender</label><br><br>
    <label for="bloodgroup">Blood Group:</label>
    <select id="bloodgroup" name="bloodgroup" required>
        <option value="a+">A+</option>
        <option value="a-">A-</option>
        <option value="b+">B+</option>
        <option value="b-">B-</option>
        <option value="ab+">AB+</option>
        <option value="ab-">AB-</option>
        <option value="o+">O+</option>
        <option value="o-">O-</option>
    </select><br><br>
    <label for="phone">phone number</label>
    <input type="tel" id="phone" name="phone" required><br><br>
    </fieldset>
    <label for="doctor">Doctor:</label>
    <select id="doctor" name="doctor" required>
        <option value="dr amna">Dr. Amna</option>
        <option value="dr ali">Dr. Ali</option>
        <option value="dr sana">Dr. Sana</option>   
        <option value="dr ahmed">Dr. Ahmed</option> 
    </select>
    <label for="date">Appointment Date:</label>
    <input type="date" id="date" name="date" required><br><br>
    <label for="time">Appointment Time:</label>
    <input type="time" id="time" name="time" required><br><br>
    <label for="reason">Reason for Appointment:</label><br>
    <textarea id="reason" name="reason" rows="4" cols="50" required></textarea><br><br>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
    </form>
</body>
</html>
